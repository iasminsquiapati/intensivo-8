<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Formulário Acessível</title>
 
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
    <main>
 
        <h1>Formulário de Contato</h1>
 
        <form>
 
            <div>
 
                <label for="nome">
                    Nome completo
                </label>
 
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    aria-required="true"
                    required
                >
 
            </div>
 
            <div>
 
                <label for="email">
                    E-mail
                </label>
 
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    aria-describedby="ajuda-email"
                    aria-required="true"
                    required
                >
 
                <small id="ajuda-email">
                    Informe um endereço de e-mail válido.
                </small>
 
            </div>
 
            <div>
 
                <label for="mensagem">
                    Mensagem
                </label>
 
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    aria-required="true"
                    required>
                </textarea>
 
            </div>
 
            <button type="submit">
                Enviar mensagem
            </button>
 
        </form>
 
    </main>
 
</body>
 
</html>
